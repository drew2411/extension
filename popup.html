<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Content Blocker</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script src="lucide.min.js"></script>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            width: 320px;
            max-height: 600px;
            overflow-y: auto;
            font-family: 'Quicksand', sans-serif;
            background: #0f172a;
            color: #e5e7eb;
            font-size: 13px;
        }
        body::-webkit-scrollbar { width: 4px; }
        body::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.2); }
        body::-webkit-scrollbar-thumb { background: rgba(255, 64, 129, 0.3); border-radius: 10px; }
        body::-webkit-scrollbar-thumb:hover { background: rgba(255, 64, 129, 0.5); }
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 14px 16px;
            background: linear-gradient(135deg, #1a1c30, #0f172a);
            border-bottom: 1px solid rgba(255,64,129,0.2);
        }
        .header-title {
            font-size: 15px;
            font-weight: 700;
            color: #FF4081;
            letter-spacing: 0.05em;
        }
        .toggle-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .toggle-label { font-size: 11px; color: #94a3b8; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
        .switch { position: relative; display: inline-block; width: 36px; height: 20px; }
        .switch input { opacity: 0; width: 0; height: 0; }
        .slider-s {
            position: absolute; inset: 0; background: #374151; border-radius: 20px;
            transition: background 0.3s; cursor: pointer;
        }
        .slider-s:before {
            content: ''; position: absolute; width: 14px; height: 14px;
            left: 3px; bottom: 3px; background: #9ca3af; border-radius: 50%; transition: 0.3s;
        }
        .switch input:checked + .slider-s { background: #FF4081; }
        .switch input:checked + .slider-s:before { transform: translateX(16px); background: #fff; }

        /* Discovery card */
        .discovery-card {
            margin: 12px;
            background: rgba(255,64,129,0.08);
            border: 1px solid rgba(255,64,129,0.3);
            border-radius: 10px;
            padding: 12px;
        }
        .discovery-card h4 { font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em; color: #FF4081; margin-bottom: 6px; }
        .discovery-card p { font-size: 12px; color: #e5e7eb; margin-bottom: 10px; line-height: 1.5; }
        .discovery-btns { display: flex; gap: 6px; }
        .discovery-btns button {
            flex: 1; padding: 6px 10px; border-radius: 6px; border: none;
            font-family: inherit; font-size: 11px; font-weight: 600; cursor: pointer; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .btn-productive { background: #16a34a; color: #fff; }
        .btn-unproductive { background: #dc2626; color: #fff; }
        .btn-dismiss { background: rgba(148,163,184,0.1); color: #94a3b8; flex: 0 0 auto; padding: 6px 8px; }

        /* Comment toggle */
        .section { padding: 12px 16px; border-bottom: 1px solid rgba(148,163,184,0.08); }
        .section-title { font-size: 10px; text-transform: uppercase; letter-spacing: 0.08em; color: #94a3b8; margin-bottom: 8px; font-weight: 600; }
        .comment-toggle {
            display: flex;
            background: rgba(15,23,42,0.8);
            border-radius: 8px;
            padding: 3px;
            gap: 2px;
        }
        .comment-toggle button {
            flex: 1; padding: 6px 4px; border: none; border-radius: 6px; font-family: inherit;
            font-size: 10px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            background: transparent; color: #64748b; text-transform: uppercase; letter-spacing: 0.04em;
        }
        .comment-toggle button.active { background: #FF4081; color: #fff; }

        /* Classification */
        .classification-box {
            padding: 10px 12px;
            background: rgba(15,23,42,0.4);
            border-radius: 8px;
            font-size: 12px;
            line-height: 1.6;
            color: #94a3b8;
        }
        .badge {
            display: inline-block; padding: 2px 8px; border-radius: 20px;
            font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.05em;
        }
        .badge-entertainment { background: rgba(239,68,68,0.15); color: #EF5350; }
        .badge-productive    { background: rgba(34,197,94,0.15); color: #22c55e; }
        .badge-unrestricted  { background: rgba(251,146,60,0.15); color: #fb923c; }
        .badge-depends       { background: rgba(251,146,60,0.15); color: #fb923c; }
        .badge-unproductive  { background: rgba(239,68,68,0.15); color: #EF5350; }
        .badge-uncategorized { background: rgba(148,163,184,0.15); color: #94a3b8; }

        /* Blocklist */
        #blocklistItems { list-style: none; max-height: 150px; overflow-y: auto; }
        #blocklistItems li {
            display: flex; justify-content: space-between; align-items: center;
            padding: 6px 8px; border-radius: 6px; font-size: 12px;
            background: rgba(15,23,42,0.3); margin-bottom: 4px;
            border: 1px solid rgba(148,163,184,0.07);
        }
        #blocklistItems li button {
            background: transparent; border: none; color: #64748b; cursor: pointer; font-size: 11px; padding: 2px 6px;
        }
        #blocklistItems li button:hover { color: #FF4081; }
        #blocklistSearch {
            width: 100%; padding: 7px 10px; border-radius: 6px;
            border: 1px solid rgba(148,163,184,0.2); background: rgba(15,23,42,0.5);
            color: #e5e7eb; font-family: inherit; font-size: 12px; outline: none; margin-bottom: 8px;
        }
        #blocklistSearch:focus { border-color: #FF4081; }

        /* Footer */
        .footer {
            padding: 10px 16px;
            display: flex; justify-content: center;
        }
        .footer a {
            font-size: 11px; color: #64748b; text-decoration: none; font-weight: 600;
            text-transform: uppercase; letter-spacing: 0.05em;
            transition: color 0.2s;
        }
        .footer a:hover { color: #FF4081; }
        .empty-state { color: #64748b; font-size: 12px; font-style: italic; text-align: center; padding: 12px; }
        
        /* Custom Scrollbar */
        #blocklistItems::-webkit-scrollbar { width: 4px; }
        #blocklistItems::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.2); border-radius: 10px; }
        #blocklistItems::-webkit-scrollbar-thumb { background: rgba(255, 64, 129, 0.3); border-radius: 10px; }
        #blocklistItems::-webkit-scrollbar-thumb:hover { background: rgba(255, 64, 129, 0.5); }

        /* Lucide Icons — target the rendered SVG class */
        .lucide {
            width: 14px;
            height: 14px;
            stroke: currentColor;
            color: #94a3b8;
            vertical-align: middle;
            margin-right: 4px;
            flex-shrink: 0;
        }
        .footer a .lucide { color: #64748b; }
        .footer a:hover .lucide { color: #FF4081; }
        .btn-productive .lucide, .btn-unproductive .lucide { color: #fff; }
        .btn-dismiss .lucide { color: #94a3b8; }
        .discovery-card h4 .lucide { color: #FF4081; }

        /* Timer styles */
        .timer-container {
            display: flex;
            align-items: center;
            gap: 10px;
            background: rgba(15, 23, 42, 0.4);
            padding: 8px 12px;
            border-radius: 8px;
            border: 1px solid rgba(148, 163, 184, 0.08);
            margin-top: 6px;
        }
        .timer-circle-box {
            position: relative;
            width: 36px;
            height: 36px;
            flex-shrink: 0;
        }
        .timer-circle-box svg {
            transform: rotate(-90deg);
        }
        .timer-circle-bg {
            fill: none;
            stroke: rgba(148, 163, 184, 0.1);
            stroke-width: 3;
        }
        .timer-circle-progress {
            fill: none;
            stroke: #FF4081;
            stroke-width: 3;
            stroke-linecap: round;
            stroke-dasharray: 100.53;
            stroke-dashoffset: 100.53;
            transition: stroke-dashoffset 0.5s ease;
        }
        .timer-info {
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }
        .timer-label {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            color: #94a3b8;
            font-weight: 600;
        }
        .timer-value {
            font-family: monospace;
            font-size: 13px;
            font-weight: 600;
            color: #fff;
        }
        .btn-select-cat, .btn-change-cat {
            font-family: inherit;
        }
    </style>
</head>
<body>
    <!-- Header: title + on/off -->
    <div class="header">
        <span class="header-title">FOCUS</span>
        <div class="toggle-row">
            <span class="toggle-label" id="enabledLabel">ON</span>
            <label class="switch">
                <input type="checkbox" id="extensionEnabled" checked>
                <span class="slider-s"></span>
            </label>
        </div>
    </div>

    <!-- Discovery card (hidden by default) -->
    <div class="discovery-card" id="discoveryCard" style="display:none;">
        <h4><i data-lucide="search"></i> New Theme Detected</h4>
        <p id="discoveryText">You've been watching a lot of <b id="discoveryTheme"></b>. Categorize it?</p>
        <div class="discovery-btns">
            <button class="btn-productive" id="discoveryProductive"><i data-lucide="check-circle-2"></i> Productive</button>
            <button class="btn-unproductive" id="discoveryUnproductive"><i data-lucide="ban"></i> Unproductive</button>
            <button class="btn-dismiss" id="discoveryDismiss"><i data-lucide="x"></i></button>
        </div>
    </div>

    <!-- Comment blocker -->
    <div class="section">
        <div class="section-title">Comment Blocker</div>
        <div class="comment-toggle">
            <button data-mode="off" id="cmt-off">Off</button>
            <button data-mode="all" id="cmt-all">All</button>
            <button data-mode="productive" id="cmt-productive">Productive Only</button>
        </div>
    </div>

    <!-- Current page -->
    <div class="section">
        <div class="section-title">Current Page</div>
        <div class="classification-box" id="currentPageClassification">Loading...</div>
    </div>

    <!-- Active Timers -->
    <div class="section" id="activeTimersSection" style="display:none;">
        <div class="section-title">Active Timers</div>
        <div id="activeTimersList" style="display:flex; flex-direction:column; gap:8px;"></div>
    </div>

    <!-- Blocklist -->
    <div class="section">
        <div class="section-title">Blocked Creators / Channels</div>
        <input type="text" id="blocklistSearch" placeholder="Search blocklist...">
        <ul id="blocklistItems"></ul>
    </div>

    <!-- Footer -->
    <div class="footer">
        <a href="#" id="openOptions"><i data-lucide="settings"></i> Open Settings</a>
    </div>

    <script src="popup.js"></script>
</body>
</html>
